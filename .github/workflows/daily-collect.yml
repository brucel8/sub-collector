name: Daily Collect and Merge

on:
  schedule:
    # 07:30 Asia/Shanghai = 23:30 UTC the day before. GitHub cron runs on
    # UTC and may start a few minutes late at busy times.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect subscriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 sub_collector.py

      - name: Merge and real-test nodes
        env:
          # The script's built-in default points at a local server path;
          # inside Actions use the copy the collector just produced.
          LINKS_FILE: out/all_links.txt
        run: python3 sub_merge.py

      - name: Commit results back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          # The remote may have moved while this run was working (e.g. a
          # manual push); rebase onto the latest main before pushing.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "Push failed after 3 attempts"
          exit 1
