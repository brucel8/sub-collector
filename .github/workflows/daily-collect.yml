name: Daily Collect and Merge

on:
  schedule:
    # 07:30 Asia/Shanghai = 23:30 UTC the day before. GitHub cron runs on
    # UTC and may start a few minutes late at busy times.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect subscriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 sub_collector.py

      - name: Merge and real-test nodes
        env:
          # The script's built-in default points at a local server path;
          # inside Actions use the copy the collector just produced.
          LINKS_FILE: out/all_links.txt
        run: python3 sub_merge.py

      - name: Commit results back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi
